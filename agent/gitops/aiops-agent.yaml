# Same app-of-apps pattern as Project 1's httpbin.yaml: Argo CD renders
# agent/k8s/kustomization.yaml from this repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aiops-agent
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: eks-httpbin-alb
  source:
    repoURL: https://github.com/4Min4m/eks-aiops-agent-security-audit.git # CHANGE-ME
    targetRevision: main
    path: agent/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: aiops-agent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
