# Read-only, scoped to the one namespace the agent investigates. This is
# the second of the two layers enforcing "no automatic remediation actions"
# from Phase 0 — even if application code had a bug, the API server itself
# would reject any write these verbs don't cover.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-agent
  namespace: aiops-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops-agent-read-only
  namespace: httpbin # TARGET_NAMESPACE — must match the agent's env var
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  # Explicitly NOT included: create, update, patch, delete on anything, and
  # NOT included: pods/exec or pods/attach (the agent investigates, it
  # never gets a shell into a container).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-agent-read-only-binding
  namespace: httpbin
subjects:
  - kind: ServiceAccount
    name: aiops-agent
    namespace: aiops-agent
roleRef:
  kind: Role
  name: aiops-agent-read-only
  apiGroup: rbac.authorization.k8s.io
