# Grafana Alloy, deployed as a Deployment (not a DaemonSet — it's reading
# EKS control-plane audit logs from CloudWatch, not tailing node-local
# files, so one replica is the right topology here).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy-audit
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: eks-httpbin-alb
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: "0.12.2" # EXAMPLE — verify & pin with `helm search repo grafana/alloy --versions`
    helm:
      values: |
        alloy:
          # Pipeline lives in security-audit/alloy-config.alloy and is
          # rendered into this ConfigMap by security-audit/kustomization.yaml
          # (Argo CD app: security-audit-config).
          configMap:
            create: false
            name: alloy-audit-config
            key: config.alloy
          extraEnv:
            - name: FIREHOSE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: alloy-firehose-access-key # create out-of-band; never commit
                  key: access-key
          extraPorts:
            - name: cw-firehose
              port: 9880
              targetPort: 9880
              protocol: TCP
        controller:
          type: deployment
          replicas: 1
    # No IRSA needed: AWS pushes to Alloy via Firehose, Alloy never calls
    # AWS APIs. The Firehose -> Alloy hop is authenticated by the access key.
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
