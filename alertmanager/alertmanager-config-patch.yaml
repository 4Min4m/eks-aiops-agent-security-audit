# Routes PodCrashLoopBackOff alerts to the agent's webhook, via an
# AlertmanagerConfig CRD (kept separate from the main kube-prometheus-stack
# Helm values).
#
# IMPORTANT — namespace: the Prometheus Operator's default
# alertmanagerConfigMatcherStrategy (OnNamespace) silently adds a
# `namespace="<this object's namespace>"` matcher to every route below. The
# CrashLoopBackOff alert carries namespace="httpbin" (from kube-state-metrics),
# so this object must live in `httpbin`; in `monitoring` the route would
# never match and the agent would never be called. Requires the Alertmanager's
# alertmanagerConfigNamespaceSelector to include httpbin (the chart default
# `{}` selects all namespaces).
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: aiops-agent-webhook
  namespace: httpbin
  labels:
    # Matches kube-prometheus-stack's default alertmanagerConfigSelector.
    release: kube-prometheus-stack
spec:
  route:
    receiver: aiops-agent
    matchers:
      - name: category
        value: aiops-investigation
        matchType: "="
    continue: true # also let the default route (e.g. Slack/email) fire
  receivers:
    - name: aiops-agent
      webhookConfigs:
        - url: "http://aiops-agent.aiops-agent.svc.cluster.local:8080/webhook/alertmanager"
          sendResolved: false
